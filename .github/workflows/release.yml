name: release

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Single rolling release: move the `rolling` tag to this commit and make
  # sure the release exists before the build jobs upload into it.
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point the rolling tag at this commit
        run: |
          git tag -f rolling
          git push origin rolling --force
      - name: Ensure the rolling release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view rolling --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create rolling \
              --repo "$GITHUB_REPOSITORY" \
              --title "Gravitas (rolling)" \
              --notes "Latest build from the release branch. Assets are replaced on every push."

  linux:
    needs: prepare
    # Oldest supported LTS: the AppImage inherits this glibc floor.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install libmpv and AppImage runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev libfuse2
      - run: uv sync
      - name: Build one-dir bundle
        run: uv run --with pyinstaller pyinstaller packaging/gravitas.spec --noconfirm
      - name: Build AppImage
        run: bash packaging/build_appimage.sh
      - name: Upload to the rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload rolling dist/Gravitas-*.AppImage --repo "$GITHUB_REPOSITORY" --clobber

  macos:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install libmpv
        run: brew install mpv
      - run: uv sync
      - name: Build app bundle
        run: uv run --with pyinstaller pyinstaller packaging/gravitas.spec --noconfirm
      - name: Ad-hoc sign
        run: codesign --force --deep --sign - dist/Gravitas.app
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Build dmg
        # Styled installer window: branded background, the app on the left and an
        # Applications drop-link on the right so users just drag across to install.
        run: |
          # create-dmg copies the *contents* of the source dir, so stage a clean
          # folder holding only the app (avoids pulling in the rest of dist/).
          rm -rf dist/dmg-src && mkdir -p dist/dmg-src
          cp -R dist/Gravitas.app dist/dmg-src/
          rm -f dist/Gravitas.dmg
          create-dmg \
            --volname "Gravitas" \
            --volicon "packaging/icon/gravitas.icns" \
            --background "packaging/dmg/background.tiff" \
            --window-pos 200 120 \
            --window-size 640 400 \
            --icon-size 128 \
            --icon "Gravitas.app" 170 185 \
            --hide-extension "Gravitas.app" \
            --app-drop-link 470 185 \
            --no-internet-enable \
            "dist/Gravitas.dmg" \
            "dist/dmg-src"
      - name: Upload to the rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload rolling dist/Gravitas.dmg --repo "$GITHUB_REPOSITORY" --clobber

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      # No libmpv package exists for Windows, so the spec downloads the
      # official mpv-dev build itself (and yt-dlp.exe with it). py7zr is the
      # in-process fallback for the extraction if the runner ever loses 7z.
      - name: Build one-dir bundle
        env:
          # Raises the GitHub API rate limit the spec's libmpv lookup uses.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --with pyinstaller --with py7zr pyinstaller packaging/gravitas.spec --noconfirm
      - name: Verify the bundle carries libmpv and yt-dlp
        shell: pwsh
        run: |
          $internal = "dist/Gravitas/_internal"
          foreach ($file in @("libmpv-2.dll", "yt-dlp.exe")) {
            if (-not (Test-Path "$internal/$file")) {
              throw "$file missing from the bundle - playback would be dead on arrival"
            }
          }
          if (Test-Path "$internal/PySide6/Qt6WebEngineCore.dll") {
            throw "QtWebEngine survived the payload filter - the installer would be 200 MB of Chromium"
          }
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist/Gravitas/* -DestinationPath dist/Gravitas-windows-x64.zip
      - name: Build the installer
        shell: pwsh
        run: |
          # Upgrade rather than install-if-missing: the .iss uses
          # ArchitecturesAllowed=x64compatible, which needs Inno Setup 6.3+,
          # and the runner image has historically shipped 6.2.
          choco upgrade innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "iscc" }
          & $iscc packaging\windows\gravitas.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
      - name: Upload to the rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release upload rolling dist/Gravitas-Setup.exe dist/Gravitas-windows-x64.zip
          --repo "$env:GITHUB_REPOSITORY" --clobber

  flatpak:
    needs: prepare
    # Independent of the AppImage/dmg jobs: a Flatpak failure never blocks them.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install libmpv, flatpak, and the freedesktop runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub \
            org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
      - run: uv sync
      - name: Build the same one-dir bundle the manifest packages
        run: uv run --with pyinstaller pyinstaller packaging/gravitas.spec --noconfirm
      - name: Build the Flatpak and export a single-file bundle
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean --repo=build/repo \
            build/flatpak packaging/flatpak/dev.skyline.Gravitas.yaml
          flatpak build-bundle build/repo dist/Gravitas.flatpak dev.skyline.Gravitas
      - name: Upload to the rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload rolling dist/Gravitas.flatpak --repo "$GITHUB_REPOSITORY" --clobber
