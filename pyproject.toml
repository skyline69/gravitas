[project]
name = "gravitas"
version = "0.1.0"
description = "Memory-efficient, Linux-first Stremio-addon media center"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.9",
    "python-mpv>=1.0.7",
    "httpx>=0.27",
    "qasync>=0.27",
    "platformdirs>=4.2",
]

[project.scripts]
gravitas = "gravitas.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-qt>=4.4",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gravitas"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["gravitas"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "tests"]
testpaths = ["tests"]
