[project]
name = "gravitas"
version = "0.1.0"
description = "Minimal, no-nonsense alternative to Stremio"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ö. Efe D. (skyline69)" }]
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.11",
    "python-mpv>=1.0.8",
    "httpx[http2]>=0.28",
    "qasync>=0.28",
    "platformdirs>=4.11",
]

[project.urls]
Homepage = "https://github.com/skyline69/gravitas"
Issues = "https://github.com/skyline69/gravitas/issues"

[project.scripts]
gravitas = "gravitas.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-qt>=4.5",
    "respx>=0.23",
    "ruff>=0.15",
    "mypy>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gravitas"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["gravitas"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "tests"]
testpaths = ["tests"]
